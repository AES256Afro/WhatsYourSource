name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run build
      - run: npm run build:firefox
      - run: npx web-ext lint --source-dir .output/firefox-mv3 --no-config-discovery --warnings-as-errors=false
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run zip && npm run zip:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: .output/*.zip
          if-no-files-found: error
          # .output is a dotdir; upload-artifact v4 skips hidden paths unless told otherwise.
          include-hidden-files: true
