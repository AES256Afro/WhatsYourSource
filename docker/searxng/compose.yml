# Local SearXNG for WhatsYourSource's local-model search tool.
#   cd docker/searxng
#   docker compose up -d
# Then set the add-on's Search tool to "SearXNG" with URL http://localhost:8888
services:
  searxng:
    image: searxng/searxng:latest
    container_name: wys-searxng
    ports:
      - '127.0.0.1:8888:8080'
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    restart: unless-stopped
